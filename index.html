<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻记单词 - 高效记忆助手</title>
    <!-- 引入 Chart.js 用于统计图表 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入 FontAwesome 用于图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="轻量级英语单词学习应用，支持间隔重复记忆">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="轻记单词">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-book-open"></i> 轻记单词</h1>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" title="切换暗黑模式">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="achievements-btn" class="icon-btn" title="成就系统">
                    <i class="fas fa-trophy"></i>
                </button>
                <button id="stats-btn" class="icon-btn" title="查看统计">
                    <i class="fas fa-chart-line"></i>
                </button>
                <button id="cloud-sync-btn" class="icon-btn" title="云同步">
                    <i class="fas fa-cloud"></i>
                </button>
                <button id="export-btn" class="icon-btn" title="导出数据">
                    <i class="fas fa-download"></i>
                </button>
                <button id="settings-btn" class="icon-btn" title="设置">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- 统计面板 (默认隐藏) -->
        <div id="stats-panel" class="panel hidden">
            <div class="panel-header">
                <h2>学习统计</h2>
                <button id="close-stats" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>总单词数</h3>
                    <p id="total-words">0</p>
                </div>
                <div class="stat-card">
                    <h3>待复习</h3>
                    <p id="due-words">0</p>
                </div>
                <div class="stat-card">
                    <h3>已掌握</h3>
                    <p id="mastered-words">0</p>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="learning-chart"></canvas>
            </div>
        </div>

        <!-- 主界面 -->
        <main id="main-view">
            <!-- 空状态提示 -->
            <div id="empty-state" class="hidden">
                <div class="empty-content">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>单词本是空的</h3>
                    <p>开始添加你的第一个单词，或者导入词库吧！</p>
                    <button id="quick-add-btn" class="primary-btn">添加第一个单词</button>
                </div>
            </div>

            <!-- 复习卡片 -->
            <div id="review-card" class="card hidden">
                <div class="card-header">
                    <span class="badge" id="card-badge">新词</span>
                    <button id="speak-btn" class="icon-btn-sm" title="朗读单词">
                        <i class="fas fa-volume-up"></i>
                    </button>
                </div>
                <h2 id="word-text">Example</h2>
                <p id="word-phonetic" class="phonetic">/ɪgˈzæmpəl/</p>
                
                <div class="definition-box" id="definition-box">
                    <p id="word-definition">点击显示释义</p>
                </div>

                <div class="action-buttons" id="action-buttons">
                    <button class="btn btn-forget" data-grade="0">忘记</button>
                    <button class="btn btn-hard" data-grade="3">模糊</button>
                    <button class="btn btn-good" data-grade="4">认识</button>
                    <button class="btn btn-easy" data-grade="5">简单</button>
                </div>
                <button id="show-answer-btn" class="primary-btn full-width">显示答案</button>
            </div>

            <!-- 管理面板 -->
            <div class="manager-section">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="add">添加单词</button>
                    <button class="tab-btn" data-tab="import">批量导入</button>
                    <button class="tab-btn" data-tab="list">单词列表</button>
                </div>

                <div class="tab-content active" id="tab-add">
                    <form id="add-word-form">
                        <div class="form-group">
                            <label>单词</label>
                            <input type="text" id="new-word" required placeholder="例如：apple">
                        </div>
                        <div class="form-group">
                            <label>释义</label>
                            <textarea id="new-definition" required placeholder="例如：苹果"></textarea>
                        </div>
                        <div class="form-group">
                            <label>音标 (可选)</label>
                            <input type="text" id="new-phonetic" placeholder="例如：/ˈæpəl/">
                        </div>
                        <button type="submit" class="primary-btn">添加单词</button>
                    </form>
                </div>

                <div class="tab-content" id="tab-import">
                    <div class="import-options">
                        <textarea id="bulk-import" placeholder="每行一个单词，格式：单词，释义，音标&#10;例如：&#10;apple,苹果，/ˈæpəl/&#10;banana,香蕉，/bəˈnænə/"></textarea>
                        <div class="import-actions">
                            <button id="import-btn" class="primary-btn">导入文本</button>
                            <label class="file-upload">
                                <input type="file" id="csv-file" accept=".csv,.txt">
                                <span><i class="fas fa-file-upload"></i> 上传 CSV/TXT</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="tab-list">
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="搜索单词...">
                    </div>
                    <div class="table-container">
                        <table id="word-table">
                            <thead>
                                <tr>
                                    <th>单词</th>
                                    <th>释义</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="word-list-body">
                                <!-- 动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 撤销提示条 -->
    <div id="toast" class="toast hidden">
        <span id="toast-message">操作已撤销</span>
        <button id="toast-undo" class="btn-sm">撤销</button>
        <button id="toast-close" class="btn-sm"><i class="fas fa-times"></i></button>
    </div>

    <!-- 成就面板 -->
    <div id="achievements-panel" class="panel hidden">
        <div class="panel-header">
            <h2>🏆 成就系统</h2>
            <button id="close-achievements" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="achievements-grid" id="achievements-list">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 云同步面板 -->
    <div id="cloud-panel" class="panel hidden">
        <div class="panel-header">
            <h2><i class="fas fa-cloud"></i> 云同步</h2>
            <button id="close-cloud" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="cloud-content">
            <p>使用 GitHub Gist 进行数据同步，支持多设备共享</p>
            <div class="form-group">
                <label>GitHub Token (用于访问 Gist)</label>
                <input type="password" id="github-token" placeholder="输入你的 GitHub Personal Access Token">
            </div>
            <div class="form-group">
                <label>Gist ID (可选，留空则自动创建)</label>
                <input type="text" id="gist-id" placeholder="例如：abc123def456">
            </div>
            <div class="cloud-actions">
                <button id="upload-to-cloud" class="primary-btn"><i class="fas fa-cloud-upload-alt"></i> 上传到云端</button>
                <button id="download-from-cloud" class="secondary-btn"><i class="fas fa-cloud-download-alt"></i> 从云端下载</button>
                <button id="generate-token-link" class="link-btn">如何获取 Token？</button>
            </div>
            <div id="cloud-status" class="status-message"></div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="panel hidden">
        <div class="panel-header">
            <h2><i class="fas fa-cog"></i> 设置</h2>
            <button id="close-settings" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="settings-content">
            <div class="form-group">
                <label>每日学习目标 (单词数)</label>
                <input type="number" id="daily-goal" min="1" max="200" value="30">
            </div>
            <div class="form-group">
                <label>新卡片每次显示数量</label>
                <input type="number" id="new-cards-limit" min="1" max="50" value="20">
            </div>
            <div class="form-group">
                <label>复习卡片每次显示数量</label>
                <input type="number" id="review-cards-limit" min="1" max="200" value="100">
            </div>
            <div class="form-group">
                <label>遗忘曲线参数调整</label>
                <div class="slider-group">
                    <label>初始间隔系数：<span id="interval-modifier-display">1.0</span></label>
                    <input type="range" id="interval-modifier" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
            </div>
            <div class="form-group">
                <label>数据管理</label>
                <div class="data-actions">
                    <button id="import-data-btn" class="secondary-btn"><i class="fas fa-file-import"></i> 导入备份</button>
                    <button id="reset-all-btn" class="danger-btn"><i class="fas fa-trash"></i> 重置所有数据</button>
                </div>
            </div>
            <button id="save-settings" class="primary-btn full-width">保存设置</button>
        </div>
    </div>

    <!-- 词典查询结果面板 -->
    <div id="dictionary-panel" class="panel hidden">
        <div class="panel-header">
            <h2><i class="fas fa-book"></i> 词典释义</h2>
            <button id="close-dictionary" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="dictionary-content" id="dictionary-result">
            <!-- 动态生成 -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
